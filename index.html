<style>
/* 駅の案内板のような白地に、地下鉄の路線図。路線の色は架空 */
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#1f2328; --ink2:#59616b; --line:#dcd8cc; --accent:#0a7a55; --gold:#e3a417; --end:#d4372c;
  --f:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-size:20px;margin:0;font-weight:800}
h1 small{font-size:12px;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);box-sizing:border-box;padding:0 8px}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 #05523a}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #05523a}
button.main.alt{background:var(--ink);box-shadow:0 4px 0 #000}
button.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;padding:0 10px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--accent);display:inline-flex;align-items:center;min-height:44px}
/* 駅名標（看板） */
.sign{background:var(--card);border-radius:10px;box-shadow:0 2px 0 #0000001a;overflow:hidden;text-align:center}
.sign .nm{font-size:30px;font-weight:800;letter-spacing:.18em;padding:14px 8px 4px}
.sign .yomi{font-size:12px;color:var(--ink2);letter-spacing:.3em;padding-bottom:8px}
.sign .bar{height:12px;background:var(--accent);display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#fff;font-size:10px}
.sign .lr{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:6px 12px}
/* 路線図 */
.map{background:var(--card);border-radius:12px;box-shadow:0 2px 0 #0000001a;padding:4px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.map svg{display:block;width:100%;height:auto}
.st text{font-size:11px;fill:var(--ink2);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;font-family:var(--f);font-weight:700;pointer-events:none}
.st.on text{fill:var(--ink)}
.tag{font-size:11px;font-weight:800;fill:#fff;font-family:var(--f)}
#route{fill:none;stroke:#1f2328;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
#won{fill:none;stroke:var(--gold);stroke-width:7;opacity:.9;stroke-linecap:round;stroke-linejoin:round}
.train{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{r:11}50%{r:14}}
.hintst{animation:blink .7s ease-in-out 3}
@keyframes blink{50%{opacity:.2}}
.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2)}
.status .bar{flex:1;height:5px;background:var(--line);border-radius:3px;margin:0 10px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.dots{display:flex;gap:6px;flex:1;max-width:140px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--gold)}.dots i.done{background:var(--accent)}
.verdict{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #00000014;animation:up .35s ease-out;text-align:center;border:2px solid var(--gold)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict b{font-size:24px}
.stars{color:var(--gold);letter-spacing:.1em;font-size:22px}
.stars .off{color:#0000001f}
.hero svg{width:100%;height:auto;display:block}
.title{font-weight:800;font-size:38px;letter-spacing:.12em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--accent);font-weight:700}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.stamps span{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink2)}
.stamps span.got{border:2px solid var(--end);color:var(--end);font-weight:800;transform:rotate(-12deg);background:#d4372c0d}
.stamps span.today{outline:2px solid var(--gold);outline-offset:1px}
.share{background:var(--card);border-radius:12px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:var(--card);border-radius:10px;padding:6px;text-align:center;font-size:12px;border:1px solid var(--line)}
.mini svg{width:100%;height:auto;display:block}
.mini #won{stroke-width:5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:none;border-radius:16px;background:var(--card);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--accent);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005}
.hint{background:#fff8e6;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="howto" aria-labelledby="howto-t">
  <h2 id="howto-t">遊び方</h2>
  <ol>
    <li><b style="color:var(--accent)">始</b>（始発）から、線路でつながった駅を順に押すか、なぞります。</li>
    <li>全部の駅を1回ずつ通って、<b style="color:var(--end)">終</b>（終点）に着けば開通。</li>
    <li>通った駅を押すと、そこまで戻れます。</li>
  </ol>
  <p>答えはどの路線図も1つだけ。時間制限はありません。今日の3路線はだれでも同じで、練習は何度でも。</p>
  <p><a id="fb2" target="_blank" rel="noopener">感想を送る</a></p>
  <button class="main" id="howto-ok" style="width:100%">わかった</button>
</dialog>
<script src="gen.js"></script>
<script>
"use strict";
const { make, seedOf, rng, SIZES, HARD } = window.ROSEN, $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/rosen-hitofude/";
const FEEDBACK = "https://github.com/satou-aaaaa/rosen-hitofude/issues/new?template=feedback.yml";
const KEY = "rosen-v1", EPOCH = "2026-11-04", SP = 60, M = 26;
const PALETTE = ["#e60012", "#0079c2", "#009944", "#f39700", "#9b7cb6", "#00a7db", "#c9a800", "#bb641d", "#e85298"];
const PRE = ["桜", "港", "東", "西", "南", "北", "青", "若", "高", "新", "本", "中", "緑", "白", "宮", "森", "柳", "梅", "松", "竹", "泉", "旭", "栄", "朝", "星", "藤", "菊", "浦", "岩", "石", "鶴", "亀"];
const SUF = ["台", "町", "橋", "坂", "原", "川", "野", "丘", "浜", "谷", "前", "田", "島", "崎", "沢", "口", "通", "園", "山", "宿"];

// ---- 日付（日本時間。だれでも同じ3路線）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
// 問題に駅名と路線の色をつける（種から決まる）
function dress(p, seed) {
  const R = rng(seed ^ 0x5bd1e995), names = new Set();
  p.names = p.pts.map(() => { let n; do { n = PRE[Math.floor(R() * PRE.length)] + SUF[Math.floor(R() * SUF.length)]; } while (names.has(n)); names.add(n); return n; });
  // 同じ向きにまっすぐ続く線路を1本の路線にまとめて色をつける
  const key = (a, b) => (a < b ? a + "-" + b : b + "-" + a);
  const has = new Set(p.edges.map(([a, b]) => key(a, b))), id = new Map(p.pts.map((q, i) => [q[0] + "," + q[1], i])), col = {};
  let c = Math.floor(R() * PALETTE.length);
  for (const [a, b] of p.edges) {
    if (col[key(a, b)]) continue;
    const color = PALETTE[c++ % PALETTE.length];
    for (const sgn of [1, -1]) { let u = a, v = b; if (sgn < 0) [u, v] = [b, a];
      while (true) { col[key(u, v)] = color; const nx = id.get((p.pts[v][0] + (p.pts[v][0] - p.pts[u][0])) + "," + (p.pts[v][1] + (p.pts[v][1] - p.pts[u][1]))); if (nx == null || !has.has(key(v, nx)) || col[key(v, nx)]) break; u = v; v = nx; } }
  }
  p.color = col;
  p.adj = p.pts.map(() => []); for (const [a, b] of p.edges) { p.adj[a].push(b); p.adj[b].push(a); }
  return p;
}
const cache = {};
function puzzle(tag) { // tag: "d:<日付>:<0-2>" / "h:<日付>" / "p:<大きさ>:<種>"
  if (cache[tag]) return cache[tag];
  const [m, a, b] = tag.split(":");
  let sz, seed;
  if (m === "d") { sz = SIZES[+b]; seed = seedOf(a + ":" + b); }
  else if (m === "h") { sz = HARD; seed = seedOf(a + "h"); }
  else { sz = +a === 3 ? HARD : SIZES[+a]; seed = +b; }
  return (cache[tag] = dress(make(seed, sz.W, sz.H, sz.holes, sz.extra), seed));
}
const dailyTags = (k) => SIZES.map((_, i) => `d:${k}:${i}`);

// ---- 記録（この端末の localStorage だけ）----
const fresh = () => ({ v: 1, days: {}, hdays: {}, cnt: 0, clean: 0, runs: {}, tut: false, kofi: {} });
let MODE = "d"; // 遊んでいるモード。途中経過はモードごとに runs[mode] へ分けて置く（練習で今日の途中を消さない）
let mem = null; // 保存できない環境（保存を切ったブラウザなど）では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.i >= r.tags.length, recOf = (r) => ({ h: r.hints });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? (r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null) : null; if (!b || b[r.date]) return false; b[r.date] = recOf(r); return true; }
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : r.i || 0) * 1e6 + (r.path ? 1 + r.path.length * 10 + (r.curHints || 0) : 0), idOf = (r) => JSON.stringify([r.list || r.tags || null, r.id || null]); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; } if (!x || !y) continue; if (x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; } else if (idOf(x) === idOf(y)) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; } } return s; } // 保存に失敗したあとはメモリと保存の両方を読み、記録（日ごとの結果・帳など）は合わせ、途中経過は新しい方（t が大きい方）を使う
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const starsOf = (h) => (h === 0 ? 3 : h === 1 ? 2 : 1);
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;
const RANKS = [[0, "見習い"], [10, "運転士"], [30, "ベテラン運転士"], [100, "名人運転士"]];
const rankOf = (n) => RANKS.filter(([x]) => n >= x).pop()[1];
const nextRank = (n) => RANKS.find(([x]) => x > n);

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1600); }
const buzz = () => { try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} };
const footer = () => `<footer><a href="#" id="f-how">遊び方</a><a id="f-fb" href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a><a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi で応援</a></footer>`;
function bindFooter() { const h = $("f-how"); if (h) h.onclick = (e) => { e.preventDefault(); openHow(); }; }
function openHow() { $("fb2").href = FEEDBACK; const d = $("howto"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
$("howto-ok").onclick = () => { const d = $("howto"); d.close ? d.close() : d.removeAttribute("open"); save((s) => { s.tut = true; }); };

// ---- 路線図を描く ----
const X = (p, i) => M + p.pts[i][0] * SP, Y = (p, i) => M + p.pts[i][1] * SP;
function mapSvg(p, opt = {}) {
  const w = M * 2 + (p.W - 1) * SP, h = M * 2 + (p.H - 1) * SP + 8, key = (a, b) => (a < b ? a + "-" + b : b + "-" + a);
  const lines = p.edges.map(([a, b]) => `<line x1="${X(p, a)}" y1="${Y(p, a)}" x2="${X(p, b)}" y2="${Y(p, b)}" stroke="#fff" stroke-width="14" stroke-linecap="round"/>`).join("") +
    p.edges.map(([a, b]) => `<line x1="${X(p, a)}" y1="${Y(p, a)}" x2="${X(p, b)}" y2="${Y(p, b)}" stroke="${p.color[key(a, b)]}" stroke-width="9" stroke-linecap="round"/>`).join("");
  const sts = p.pts.map((_, i) => `<g class="st" id="st${i}"><circle cx="${X(p, i)}" cy="${Y(p, i)}" r="9" fill="#fff" stroke="#1f2328" stroke-width="3"/>${opt.names === false ? "" : `<text x="${X(p, i)}" y="${Y(p, i) + 24}" text-anchor="middle">${p.names[i]}</text>`}</g>`).join("");
  const tag = (i, t, c) => `<g><rect x="${X(p, i) - 11}" y="${Y(p, i) - 32}" width="22" height="18" rx="5" fill="${c}"/><text class="tag" x="${X(p, i)}" y="${Y(p, i) - 19}" text-anchor="middle">${t}</text></g>`;
  const route = opt.sol ? `<polyline id="won" points="${p.sol.map((i) => X(p, i) + "," + Y(p, i)).join(" ")}"/>` : `<polyline id="route" points=""/>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="路線図 ${p.pts.length}駅">${lines}${route}${sts}${tag(p.s, "始", "#0a7a55")}${tag(p.e, "終", "#d4372c")}<circle id="train" class="train" r="11" fill="none" stroke="#e3a417" stroke-width="4" cx="-99" cy="-99"/></svg>`;
}

// ---- ホーム ----
function home() {
  const s = load(), k = todayKey(), done = s.days[k], hdone = s.hdays[k];
  // 最後の1問を終えて結果を見る前に閉じた日は、開き直したら結果へ進める（記録をつける）
  for (const m of ["d", "h"]) { const r = s.runs[m]; if (r && r.i >= r.tags.length) { MODE = m; return finish(); } }
  const rd = s.runs.d, run = rd && rd.date === k ? rd : null;
  const nr = nextRank(s.cnt);
