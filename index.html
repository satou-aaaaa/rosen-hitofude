<style>
/* 駅の案内板のような白地に、地下鉄の路線図。路線の色は架空 */
:root{
  --bg:#f3f1ea; --card:#ffffff; --ink:#1f2328; --ink2:#59616b; --line:#dcd8cc; --accent:#0a7a55; --gold:#e3a417; --end:#d4372c;
  --f:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html{height:100%}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-size:20px;margin:0;font-weight:800}
h1 small{font-size:12px;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--card);box-sizing:border-box;padding:0 8px}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 #05523a}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #05523a}
button.main.alt{background:var(--ink);box-shadow:0 4px 0 #000}
button.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;padding:0 10px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--accent);display:inline-flex;align-items:center;min-height:44px}
/* 駅名標（看板） */
.sign{background:var(--card);border-radius:10px;box-shadow:0 2px 0 #0000001a;overflow:hidden;text-align:center}
.sign .nm{font-size:30px;font-weight:800;letter-spacing:.18em;padding:14px 8px 4px}
.sign .yomi{font-size:12px;color:var(--ink2);letter-spacing:.3em;padding-bottom:8px}
.sign .bar{height:12px;background:var(--accent);display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#fff;font-size:10px}
.sign .lr{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:6px 12px}
/* 路線図 */
.map{background:var(--card);border-radius:12px;box-shadow:0 2px 0 #0000001a;padding:4px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
.map svg{display:block;width:100%;height:auto}
.st text{font-size:11px;fill:var(--ink2);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;font-family:var(--f);font-weight:700;pointer-events:none}
.st.on text{fill:var(--ink)}
.tag{font-size:11px;font-weight:800;fill:#fff;font-family:var(--f)}
#route{fill:none;stroke:#1f2328;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
#won{fill:none;stroke:var(--gold);stroke-width:7;opacity:.9;stroke-linecap:round;stroke-linejoin:round}
.train{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{r:11}50%{r:14}}
.hintst{animation:blink .7s ease-in-out 3}
@keyframes blink{50%{opacity:.2}}
.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2)}
.status .bar{flex:1;height:5px;background:var(--line);border-radius:3px;margin:0 10px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.dots{display:flex;gap:6px;flex:1;max-width:140px}
.dots i{flex:1;height:6px;border-radius:3px;background:transparent;border:1.5px solid var(--ink2);box-sizing:border-box}
.dots i.on{background:var(--gold);border:2px solid #7a5a00;height:10px}.dots i.done{background:var(--accent);border-color:var(--accent)} /* 色だけで分けない：まだは中が空・いまは太く高い・済みは塗る */
.verdict{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #00000014;animation:up .35s ease-out;text-align:center;border:2px solid var(--gold)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict b{font-size:24px}
.stars{color:var(--gold);letter-spacing:.1em;font-size:22px}
.stars .off{color:#8b8f94}
.big{font-weight:800;font-size:26px;text-align:center;margin:0}
.hero svg{width:100%;height:auto;display:block;max-height:34vh}
button.main small{font-size:13px;font-weight:700}
button.main{flex-wrap:wrap;column-gap:8px;row-gap:0;text-wrap:balance}
.won .row.ctl,.won .tut{display:none}
.hint{text-wrap:balance}
.title{font-weight:800;font-size:38px;letter-spacing:.12em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--accent);font-weight:700}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.stamps span{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink2)}
.stamps span.got{border:2px solid var(--end);color:var(--end);font-weight:800;transform:rotate(-12deg);background:#d4372c0d}
.stamps span.got.late{border-style:dashed;transform:none;background:none}
.stamps span.today{outline:2px solid var(--gold);outline-offset:1px}
.share{background:var(--card);border-radius:12px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:var(--card);border-radius:10px;padding:6px;text-align:center;font-size:12px;border:1px solid var(--line)}
.mini svg{width:100%;height:auto;display:block}
.mini #won{stroke-width:5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:none;border-radius:16px;background:var(--card);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--accent);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005}
.hint{background:#fff8e6;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
/* 手ごたえ：着いた駅がはずむ・つながっていない駅は小さくゆれる・取り残された駅は赤い点線 */
.st circle{transform-box:fill-box;transform-origin:center}
.st.pop circle{animation:pop .28s ease-out}
@keyframes pop{40%{transform:scale(1.45)}}
.st.nope circle{animation:nope .3s ease-in-out}
@keyframes nope{25%{transform:translateX(-3px);stroke:#d4372c}75%{transform:translateX(3px);stroke:#d4372c}}
.st.lost circle{stroke:var(--end);stroke-dasharray:4 3}
.st.can circle{stroke:var(--accent);stroke-width:5}
.st.can .ring{stroke:#0a7a5540;stroke-width:3}
.st[tabindex]{cursor:pointer}
.st .ring{fill:none;stroke:none;stroke-width:3.5;pointer-events:none}
.st:focus-visible .ring{stroke:#1a5fd0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* 色の見分けを助ける：路線の色をカラーユニバーサルデザインの組に替え、いまの道・もう行けない駅・ヒントの駅を形でも強める（路線の色は飾りで、遊びの答えには関わらない） */
html.a11y-cvd .ln.c0{stroke:#D55E00}html.a11y-cvd .ln.c1{stroke:#0072B2}html.a11y-cvd .ln.c2{stroke:#009E73}html.a11y-cvd .ln.c3{stroke:#E69F00}html.a11y-cvd .ln.c4{stroke:#CC79A7}html.a11y-cvd .ln.c5{stroke:#56B4E9}html.a11y-cvd .ln.c6{stroke:#B8A000}html.a11y-cvd .ln.c7{stroke:#8C5A2B}html.a11y-cvd .ln.c8{stroke:#7F3C8D}
html.a11y-cvd #route{stroke:#000;stroke-width:7;stroke-dasharray:none}
html.a11y-cvd .st.lost circle{stroke:#D55E00;stroke-width:4;stroke-dasharray:3 3}
html.a11y-cvd .st.hintst circle{stroke:#0072B2;stroke-width:5}
html.a11y-cvd .st.can circle{stroke:#0072B2;stroke-width:6}
html.a11y-cvd .dots i.on{background:#E69F00}html.a11y-cvd .dots i.done{background:#0072B2;border-color:#0072B2}
html.a11y-cvd .stars{color:#B86E00}
.warn{background:#fdecea;border:1px solid var(--end);color:#8f1d15;border-radius:12px;padding:8px 12px;font-size:14px;text-align:center;font-weight:700}
.warn[hidden]{display:none}
.won-st circle{animation:lit .5s ease-out both}
@keyframes lit{50%{transform:scale(1.35);fill:#e3a417}}
/* 実績・乗車記録 */
.achnext{text-align:center;font-size:13px;color:var(--ink2,#666);margin:0}
.achnew{background:#fff8e6;border:1px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;margin:0;text-align:center}
.achs{display:flex;flex-direction:column;gap:8px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;align-items:center}
.ach .ic{grid-row:span 2;font-size:24px;text-align:center;filter:grayscale(1);opacity:.45}
.ach.got{border-color:var(--gold);background:#fffaf0}
.ach.got .ic{filter:none;opacity:1}
.ach b{font-size:15px}
.ach small{color:var(--ink2);font-size:12px;grid-column:2}
.ach .k{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.ach .pg{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.ach .pg i{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.ach .pg i span{display:block;height:100%;background:var(--accent)}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav b{font-size:17px}
.calnav .icon:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--ink2);text-align:center}
.cal .c{min-height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);box-sizing:border-box;position:relative;line-height:1.1}
.cal .c.e{background:none;border:none}
.cal .c.out{background:none;border:1px dotted var(--line);color:var(--ink2)}
.cal .c i{font-style:normal;font-size:10px;letter-spacing:-.05em}
.cal .c.d1{background:#0a7a5533;color:var(--ink)}.cal .c.d2{background:#0a7a5577;color:var(--ink)}.cal .c.d3{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal .c.late{background:#0a7a5514;border:1.5px dashed var(--accent);color:var(--ink)}
.cal .c.hd::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.cal .c.today{outline:2px solid var(--gold);outline-offset:1px}
.cal button.c{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;border:1.5px dashed var(--ink2);color:var(--ink);background:var(--card);line-height:1.1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend em{display:inline-block;width:14px;height:14px;border-radius:4px}
.misses{display:flex;flex-wrap:wrap;gap:8px}
.misses button.sub{flex:1 1 30%;min-width:88px;flex-direction:column;gap:0;font-size:14px}
@media (max-width:360px){.row>.sub{font-size:14px;padding:0 6px}}
.misses small{font-size:11px;color:var(--ink2);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタン（カレンダーのます目など）でも枠が消えないよう、いちばん最後に強く書く（2026-11-04 CodeRabbit） */
:is(button,a):focus-visible{outline:3px solid var(--gold)!important;outline-offset:2px}
</style>
